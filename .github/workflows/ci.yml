name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast lane — syntax / flake surface only
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      - name: flake show
        run: nix flake show

      - name: recovery control-flow fixtures
        run: python3 -m unittest discover -s tests -v

      - name: scripts syntax
        run: |
          for s in scripts/*.sh; do
            bash -n "$s"
            echo "ok $s"
          done

  # Slow lane — one full system build (not also flake check; same derivation)
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size: 5G

      - name: build nixos system closure
        run: nix build .#nixos --print-build-logs

  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse installer and restore drill
        shell: pwsh
        run: |
          foreach ($path in @('scripts/install.ps1', 'scripts/restore-drill.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
